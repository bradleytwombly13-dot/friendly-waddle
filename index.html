<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pixel Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#14181C;
    --ink-2:#1C2229;
    --card:#1C2229;
    --paper:#EDEAE0;
    --paper-2:#E2DECE;
    --marker:#E4572E;
    --marker-dark:#C4451F;
    --text-light:#ECEAE3;
    --text-dim:#8B9299;
    --text-dark:#1B1F23;
    --good:#4A7A4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:var(--ink);font-family:'Public Sans',sans-serif;color:var(--text-light);}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}

  header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;
    background:rgba(20,24,28,0.92);backdrop-filter:blur(6px);
    border-bottom:1px solid #262D34;
    flex-wrap:wrap;gap:10px;
  }
  .title{font-size:17px;letter-spacing:0.02em;font-weight:700;}
  .title span{color:var(--marker);}
  #authArea{display:flex;align-items:center;gap:10px;}
  #userChip{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  #userChip b{color:var(--text-light);font-weight:600;}
  #signOutBtn{background:none;border:1px solid #3A414A;color:var(--text-dim);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
  #signOutBtn:hover{color:var(--text-light);border-color:#5A626B;}

  main{max-width:1000px;margin:0 auto;padding:28px 20px 80px;}
  .intro{margin-bottom:26px;}
  .intro h1{font-size:22px;margin:0 0 6px;}
  .intro p{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0;}

  #questBox{
    background:var(--card);border:1px solid #262D34;border-radius:10px;
    padding:16px 18px;margin-bottom:26px;display:none;
  }
  #questBox.show{display:block;}
  #questBox h3{margin:0 0 8px;font-size:14px;color:var(--text-light);}
  .questSteps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .questStep{
    font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid #3A414A;color:var(--text-dim);
  }
  .questStep.done{border-color:var(--good);color:var(--good);background:rgba(74,122,74,0.12);}
  #createCanvasBtn{
    background:var(--marker);color:#fff;border:none;border-radius:6px;padding:9px 16px;
    font-weight:600;font-size:13px;cursor:pointer;
  }
  #createCanvasBtn:disabled{opacity:0.4;cursor:default;}
  #questHint{font-size:12px;color:var(--text-dim);margin-top:8px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:16px;}
  .card{
    background:var(--card);border:1px solid #262D34;border-radius:10px;overflow:hidden;
    text-decoration:none;color:inherit;display:flex;flex-direction:column;
    transition:border-color 0.15s;
  }
  .card:hover{border-color:var(--marker);}
  .card-thumb{
    aspect-ratio:1/1;background:#20262C;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#3A414A;
  }
  .card-body{padding:14px 16px 16px;}
  .card-name{font-weight:700;font-size:15px;margin-bottom:4px;}
  .card-desc{font-size:12.5px;color:var(--text-dim);line-height:1.4;margin-bottom:10px;min-height:34px;}
  .card-meta{font-size:11px;color:#5A626B;display:flex;justify-content:space-between;}
  .starter-tag{color:var(--marker);}

  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;
    align-items:center;justify-content:center;padding:16px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--paper);color:var(--text-dark);border-radius:10px;padding:22px;
    width:100%;max-width:420px;font-family:'Public Sans',sans-serif;
  }
  .modal h2{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#5A5F65;}
  .field input, .field textarea{
    width:100%;padding:8px 10px;border:1px solid #C7C2B2;border-radius:5px;font-family:inherit;font-size:13px;background:#fff;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .dimRow{display:flex;gap:10px;}
  .dimRow .field{flex:1;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:10px;border:none;border-radius:5px;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-cancel{background:transparent;border:1px solid #C7C2B2 !important;color:var(--text-dark);}
  .btn-primary{background:var(--marker);color:#fff;}
  .modalErr{color:var(--marker-dark);font-size:12px;margin-top:6px;display:none;}
</style>
</head>
<body>

<header>
  <div class="title">THE PIXEL <span>CANVAS</span></div>
  <div id="authArea">
    <div id="userChip"><b id="userName"></b><button id="signOutBtn">Sign out</button></div>
    <div id="gsiButton"></div>
  </div>
</header>

<main>
  <div class="intro">
    <h1>Community pixel canvases</h1>
    <p>Claim a rectangle on any canvas below and make it yours. Sign in with Google to track your progress and unlock creating your own canvas.</p>
  </div>

  <div id="questBox">
    <h3>Create your own canvas</h3>
    <div class="questSteps" id="questSteps"></div>
    <div id="questAction"></div>
    <div id="questHint"></div>
  </div>

  <div class="grid" id="canvasGrid"></div>
</main>

<div class="modal-backdrop" id="createBackdrop">
  <div class="modal">
    <h2>Create your canvas</h2>
    <div class="field"><label>Name</label><input type="text" id="cName" maxlength="60" placeholder="e.g. Sunset Skyline"></div>
    <div class="field"><label>Description</label><textarea id="cDesc" maxlength="300" placeholder="What's this canvas for?"></textarea></div>
    <div class="dimRow">
      <div class="field"><label>Width (px)</label><input type="number" id="cWidth" value="5000" min="50" max="20000"></div>
      <div class="field"><label>Height (px)</label><input type="number" id="cHeight" value="5000" min="50" max="20000"></div>
    </div>
    <div style="font-size:11px;color:#7A7F84;">Max 100,000,000 total pixels. This can't be changed later.</div>
    <div class="modalErr" id="createErr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelCreate">Cancel</button>
      <button class="btn-primary" id="submitCreate">Create</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;

async function loadMe(){
  const res = await fetch('/api/me');
  const data = await res.json();
  const chip = document.getElementById('userChip');
  const gsi = document.getElementById('gsiButton');
  const questBox = document.getElementById('questBox');

  if(data.loggedIn){
    currentUser = data.user;
    chip.style.display = 'flex';
    gsi.style.display = 'none';
    document.getElementById('userName').textContent = data.user.name;

    questBox.classList.add('show');
    const steps = document.getElementById('questSteps');
    steps.innerHTML = '';
    const starterNames = {'original-100m':'The Pixel Canvas','mini-1m':'Mini Canvas','mega-canvas':'The Mega Canvas'};
    for(const id of Object.keys(starterNames)){
      const done = data.user.claimedStarters.includes(id);
      const span = document.createElement('span');
      span.className = 'questStep' + (done ? ' done' : '');
      span.textContent = (done?'✓ ':'') + starterNames[id];
      steps.appendChild(span);
    }
    const action = document.getElementById('questAction');
    const hint = document.getElementById('questHint');
    action.innerHTML = '';
    if(data.user.hasCreatedCanvas){
      hint.textContent = '';
      const link = document.createElement('a');
      link.href = `/canvas.html?id=${encodeURIComponent(data.user.ownCanvasId)}`;
      link.style.color = 'var(--marker)';
      link.style.fontSize = '13px';
      link.textContent = 'View your canvas →';
      action.appendChild(link);
    } else {
      const btn = document.createElement('button');
      btn.id = 'createCanvasBtn';
      btn.textContent = 'Create your canvas';
      btn.disabled = !data.user.questComplete;
      btn.onclick = openCreateModal;
      action.appendChild(btn);
      hint.textContent = data.user.questComplete
        ? "You've unlocked canvas creation!"
        : 'Claim at least one block on all three starter canvases above to unlock this.';
    }
  } else {
    currentUser = null;
    chip.style.display = 'none';
    gsi.style.display = 'block';
    questBox.classList.remove('show');
  }
}

async function loadCanvases(){
  const res = await fetch('/api/canvases');
  const data = await res.json();
  const grid = document.getElementById('canvasGrid');
  grid.innerHTML = '';
  for(const c of data.canvases){
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `/canvas.html?id=${encodeURIComponent(c.id)}`;
    a.innerHTML = `
      <div class="card-thumb">${(c.width*c.height).toLocaleString()} px</div>
      <div class="card-body">
        <div class="card-name">${escapeHtml(c.name)}</div>
        <div class="card-desc">${escapeHtml(c.description||'')}</div>
        <div class="card-meta">
          <span>${c.width.toLocaleString()} × ${c.height.toLocaleString()}</span>
          <span>${c.isStarter ? '<span class="starter-tag">Starter</span>' : (c.ownerName ? 'by '+escapeHtml(c.ownerName) : '')}</span>
        </div>
      </div>`;
    grid.appendChild(a);
  }
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Google Sign-In ----
window.handleCredentialResponse = async (response)=>{
  try{
    const res = await fetch('/api/auth', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ credential: response.credential })
    });
    if(res.ok){ await loadMe(); }
    else { const err = await res.json().catch(()=>({})); alert(err.error || 'Sign-in failed.'); }
  }catch(e){ alert('Sign-in failed. Try again.'); }
};

function initGoogle(){
  if(!window.google || !window.GOOGLE_CLIENT_ID) return;
  google.accounts.id.initialize({
    client_id: window.GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
  });
  google.accounts.id.renderButton(document.getElementById('gsiButton'), {
    theme:'filled_black', size:'medium', shape:'pill',
  });
}

document.getElementById('signOutBtn').onclick = async ()=>{
  await fetch('/api/auth', { method:'DELETE' });
  if(window.google) google.accounts.id.disableAutoSelect();
  await loadMe();
};

// ---- Create canvas modal ----
function openCreateModal(){
  document.getElementById('createErr').style.display = 'none';
  document.getElementById('cName').value = '';
  document.getElementById('cDesc').value = '';
  document.getElementById('createBackdrop').classList.add('show');
}
document.getElementById('cancelCreate').onclick = ()=> document.getElementById('createBackdrop').classList.remove('show');
document.getElementById('submitCreate').onclick = async ()=>{
  const name = document.getElementById('cName').value.trim();
  const description = document.getElementById('cDesc').value.trim();
  const width = parseInt(document.getElementById('cWidth').value, 10);
  const height = parseInt(document.getElementById('cHeight').value, 10);
  const errEl = document.getElementById('createErr');
  const btn = document.getElementById('submitCreate');
  if(!name){ errEl.textContent = 'Name is required.'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const res = await fetch('/api/canvases', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, description, width, height })
    });
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Something went wrong.'; errEl.style.display='block'; return; }
    location.href = `/canvas.html?id=${encodeURIComponent(data.canvas.id)}`;
  }catch(e){
    errEl.textContent = 'Could not reach the server.'; errEl.style.display='block';
  }finally{
    btn.disabled = false; btn.textContent = 'Create';
  }
};

// ---- init ----
// window.GOOGLE_CLIENT_ID is set below — replace with your real OAuth client ID.
window.GOOGLE_CLIENT_ID = '299084457550-mplaikk8h8q9u9b86ikvot0f43p9vphu.apps.googleusercontent.com';
loadMe();
loadCanvases();
const gsiCheck = setInterval(()=>{ if(window.google){ initGoogle(); clearInterval(gsiCheck); } }, 100);
</script>
</body>
</html>
